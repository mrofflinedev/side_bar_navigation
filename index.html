<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <input type="checkbox" id="theme" class="theme-toggle" />
    <div class="page">
        <aside class="sidebar">
            <div class="brand">
                <img class="logo" src="IMG-20251129-WA0014.jpg" alt="Student Admin logo" />
                <span class="brand-text">
                    <span class="brand-name">Student Admin</span>
                    <span class="brand-sub">Collins Wawire</span>
                </span>
                <i class="brand-chevron" data-lucide="chevrons-up-down"></i>
            </div>

            <div class="search">
                <i data-lucide="search"></i>
                <input type="text" placeholder="Search..." />
            </div>

            <p class="section-label">PAGES</p>
            <ul class="nav">
                <li>
                    <input type="radio" name="nav" id="nav-dashboard" class="nav-radio" checked />
                    <label for="nav-dashboard">
                        <span class="icon-wrap"><i data-lucide="layout-grid"></i></span>
                        <p>Dashboard</p>
                    </label>
                </li>
                <li>
                    <input type="radio" name="nav" id="nav-teachers" class="nav-radio" />
                    <label for="nav-teachers">
                        <span class="icon-wrap"><i data-lucide="graduation-cap"></i></span>
                        <p>Teachers</p>
                    </label>
                </li>
                <li>
                    <input type="radio" name="nav" id="nav-parents" class="nav-radio" />
                    <label for="nav-parents">
                        <span class="icon-wrap"><i data-lucide="users"></i></span>
                        <p>Parents</p>
                    </label>
                </li>
                <li>
                    <input type="radio" name="nav" id="nav-library" class="nav-radio" />
                    <label for="nav-library">
                        <span class="icon-wrap"><i data-lucide="book-open"></i></span>
                        <p>Library</p>
                    </label>
                </li>
                <li>
                    <input type="radio" name="nav" id="nav-class" class="nav-radio" />
                    <label for="nav-class">
                        <span class="icon-wrap"><i data-lucide="briefcase"></i></span>
                        <p>Class</p>
                    </label>
                </li>
                <li>
                    <input type="radio" name="nav" id="nav-attendance" class="nav-radio" />
                    <label for="nav-attendance">
                        <span class="icon-wrap"><i data-lucide="clipboard-check"></i></span>
                        <p>Attendance</p>
                    </label>
                </li>
                <li>
                    <input type="radio" name="nav" id="nav-transcript" class="nav-radio" />
                    <label for="nav-transcript">
                        <span class="icon-wrap"><i data-lucide="badge-check"></i></span>
                        <p>Transcript</p>
                    </label>
                </li>
            </ul>

            <p class="section-label">ACCOUNT</p>
            <ul class="nav">
                <li>
                    <input type="radio" name="nav" id="nav-help" class="nav-radio" />
                    <label for="nav-help">
                        <span class="icon-wrap"><i data-lucide="circle-help"></i></span>
                        <p>Help Line</p>
                    </label>
                </li>
                <li>
                    <input type="radio" name="nav" id="nav-settings" class="nav-radio" />
                    <label for="nav-settings">
                        <span class="icon-wrap"><i data-lucide="settings"></i></span>
                        <p>Settings</p>
                    </label>
                </li>
                <li>
                    <input type="radio" name="nav" id="nav-logout" class="nav-radio" />
                    <label for="nav-logout">
                        <span class="icon-wrap"><i data-lucide="log-out"></i></span>
                        <p>Log Out</p>
                    </label>
                </li>
            </ul>

            <p class="section-label">CONNECTIONS</p>
            <div class="avatars">
                <img src="IMG-20251129-WA0014.jpg" alt="User 1" />
                <img src="avator two.avif" alt="User 2" />
                <img src="avator three.avif" alt="User 3" />
                <img src="avatorfive.avif" alt="User 4" />
                <img src="avator four.avif" alt="User 5" />
            </div>

            <label class="theme-switch" for="theme">
                <span class="switch"></span>
                <p>Dark Mode</p>
            </label>
        </aside>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
